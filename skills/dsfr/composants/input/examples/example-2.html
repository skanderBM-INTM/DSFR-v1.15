<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Champ de saisie - Exemple 2</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Champ de saisie - Exemple 2</h1>
    <div class="fr-my-2w">
      <div class="fr-input-group">
          <label class="fr-label" for="text-input-button">
              Libellé champ de saisie
          </label>
          <div class="fr-input-wrap fr-input-wrap--addon">
              <input class="fr-input" aria-describedby="text-input-button-messages" id="text-input-button" type="text">
              <button type="button" class="fr-btn">Envoyer</button>
          </div>
          <div class="fr-messages-group" id="text-input-button-messages" aria-live="polite">
          </div>
      </div>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
