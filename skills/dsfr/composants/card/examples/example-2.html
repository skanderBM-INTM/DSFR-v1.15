<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Carte - Exemple 2</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Carte - Exemple 2</h1>
    <div class="fr-my-2w">
      <div class="fr-card fr-enlarge-link fr-card--download">
          <div class="fr-card__body">
              <div class="fr-card__content">
                  <h3 class="fr-card__title">
                      <a download href="/example/img/placeholder.3x4.pdf">Télécharger le/la [Typologie de document] « [Nom du document] »</a>
                  </h3>
                  <p class="fr-card__desc">Lorem [...] elit ut.</p>
                  <div class="fr-card__start">
                      <ul class="fr-badges-group">
                          <li>
                              <span class="fr-badge fr-badge--purple-glycine">Libellé badge</span>
                          </li>
                          <li>
                              <span class="fr-badge fr-badge--green-menthe">Libellé badge</span>
                          </li>
                      </ul>
                      <p class="fr-card__detail fr-icon-info-line">détail (optionnel)</p>
                  </div>
                  <div class="fr-card__end">
                      <p class="fr-card__detail">PDF - 48 ko</p>
                  </div>
              </div>
          </div>
          <div class="fr-card__header">
              <div class="fr-card__img">
                  <img class="fr-responsive-img" src="../../../../example/img/placeholder.3x4.png" alt="[À MODIFIER - vide ou texte alternatif de l’image]" />
              </div>
          </div>
      </div>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
