<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Indicateur d’étapes - Exemple 1</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Indicateur d’étapes - Exemple 1</h1>
    <div class="fr-my-2w">
      <div class="fr-stepper">
          <h2 class="fr-stepper__title">
              Titre de l’étape en cours
              <span class="fr-stepper__state">Étape 1 sur 3</span>
          </h2>
          <div class="fr-stepper__steps" data-fr-current-step="1" data-fr-steps="3"></div>
          <p class="fr-stepper__details">
              <span class="fr-text--bold">Étape suivante :</span> Titre de la prochaine étape
          </p>
      </div>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
