<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Citation - Exemple 1</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Citation - Exemple 1</h1>
    <div class="fr-my-2w">
      <figure class="fr-quote fr-quote--column">
          <blockquote cite="[À MODIFIER - https://lien-vers-la-source.fr]">
              <p>« Lorem [...] elit ut. »</p>
          </blockquote>
          <figcaption>
              <p class="fr-quote__author">Auteur</p>
              <ul class="fr-quote__source">
                  <li>
                      <cite>Ouvrage</cite>
                  </li>
                  <li>Détail 1</li>
                  <li>Détail 2</li>
                  <li>Détail 3</li>
                  <li>
                      <a href="">Détail 4</a>
                  </li>
              </ul>
              <div class="fr-quote__image">
                  <img class="fr-responsive-img" src="../../../example/img/placeholder.1x1.png" alt="" />
                  <!-- L’alternative de l’image (attribut alt) doit rester vide car l’image est illustrative et ne doit pas être restituée aux technologies d’assistance -->
              </div>
          </figcaption>
      </figure>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
