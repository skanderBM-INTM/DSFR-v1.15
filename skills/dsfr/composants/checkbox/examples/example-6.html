<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Case à cocher - Exemple 6</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Case à cocher - Exemple 6</h1>
    <div class="fr-my-2w">
      <div class="fr-checkbox-group fr-checkbox-group--valid">
          <input id="checkbox-valid" type="checkbox" aria-describedby="checkbox-messages-valid">
          <label class="fr-label" for="checkbox-valid">
              Libellé checkbox avec succès
          </label>
          <div class="fr-messages-group" id="checkbox-messages-valid" aria-live="polite">
              <p class="fr-message fr-message--valid">Texte de succès</p>
          </div>
      </div>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
