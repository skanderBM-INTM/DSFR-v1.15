<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Case à cocher - Exemple 10</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Case à cocher - Exemple 10</h1>
    <div class="fr-my-2w">
      <fieldset class="fr-fieldset" disabled aria-labelledby="checkboxes-legend checkboxes-messages">
          <legend class="fr-fieldset__legend--regular fr-fieldset__legend" id="checkboxes-legend">
              Légende pour l’ensemble des éléments déactivés
          </legend>
          <div class="fr-fieldset__element">
              <div class="fr-checkbox-group">(...)</div>
          </div>
          <div class="fr-fieldset__element">
              <div class="fr-checkbox-group">(...)</div>
          </div>
          <div class="fr-messages-group" id="checkboxes-messages" aria-live="polite">
          </div>
      </fieldset>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
