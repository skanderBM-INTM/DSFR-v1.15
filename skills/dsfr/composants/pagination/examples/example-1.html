<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>

  <title>DSFR - Pagination - Exemple 1</title>

              </li>
              <li>
                  <a class="fr-pagination__link fr-pagination__link--last" href="#" title="Dernière page">
                      Dernière page

              </li>
          </ul>

  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
