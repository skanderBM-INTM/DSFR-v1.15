<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Modale - Exemple 1</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Modale - Exemple 1</h1>
    <div class="fr-my-2w">
      <button data-fr-opened="false" aria-controls="modal" type="button" class="fr-btn">Modale simple</button>
      <dialog id="modal" class="fr-modal" aria-labelledby="modal-title">
          <div class="fr-container fr-container--fluid fr-container-md">
              <div class="fr-grid-row fr-grid-row--center">
                  <div class="fr-col-12 fr-col-md-8 fr-col-lg-6">
                      <div class="fr-modal__body">
                          <div class="fr-modal__header">
                              <button aria-controls="modal" title="Fermer" type="button" class="fr-btn--close fr-btn">Fermer</button>
                          </div>
                          <div class="fr-modal__content">
                              <h2 id="modal-title" class="fr-modal__title">
                                  <span class="fr-icon-arrow-right-line fr-icon--lg" aria-hidden="true"></span>
                                  Titre de la modale
                              </h2>
                              <p>
                                <!-- contenu de la modale -->
                              </p>
                          </div>
                      </div>
                  </div>
              </div>
          </div>
      </dialog>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
