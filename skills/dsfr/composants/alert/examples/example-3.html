<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Alerte - Exemple 3</title>
  <!-- CSS DSFR officiel v1.15.4 -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/utility/utility.min.css">
</head>
<body>
  <div class="fr-container fr-my-4w">
    <h1>Alerte - Exemple 3</h1>
    <div class="fr-my-2w">
      <div class="fr-alert fr-alert--success fr-alert--sm">
        <h3 class="fr-alert__title">Succès</h3>
        <p>Votre demande a été traitée avec succès.</p>
        <button title="Masquer le message" onclick="const alert = this.parentNode; alert.parentNode.removeChild(alert)" type="button" class="fr-btn--close fr-btn">Masquer le message</button>
      </div>
    </div>
  </div>

  <!-- JS DSFR officiel -->
  <script type="module" src="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.15.4/dist/dsfr.module.min.js"></script>
</body>
</html>
