<!DOCTYPE html>
<html lang="fr" data-fr-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DSFR - Gestionnaire de consentement - Exemple 3</title>
  <!-- CSS DSFR officiel v1.15.4 -->

<body>

    <h1>Gestionnaire de consentement - Exemple 3</h1>
